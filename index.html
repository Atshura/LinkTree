<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cendikia titan Aulia Pujiono</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9; /* Warna latar abu-abu sangat terang */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            background-color: #ddd; /* Ganti dengan link gambar logo Anda nanti */
            border-radius: 50%;
            margin-bottom: 20px;
            object-fit: cover;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p.bio {
            color: #666;
            margin-bottom: 30px;
            text-align: center;
            max-width: 400px;
        }
        .link-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Jarak antar tombol */
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .link-btn:hover {
            background-color: #333;
            transform: scale(1.02); /* Efek membesar sedikit saat disentuh */
        }
        .link-btn.primary {
            background-color: #2962ff; /* Warna biru untuk tombol utama */
        }
        .link-btn.primary:hover {
            background-color: #0039cb;
        }
    </style>
</head>
<body>

    <!-- Nanti ganti 'src' dengan link gambar logo atau profil Anda -->
    <img src="https://via.placeholder.com/120" alt="Profile" class="profile-img">
    
    <h1>Atshura Comics</h1>
    <p class="bio">Selamat datang! Silahkan Pilih dari opsi berikut:</p>

    <div class="link-container">
        <!-- Tombol 1: Ebook Komik Utama -->
        <a href="https://revianchim.me" class="link-btn primary" target="_blank">
            📖 Baca Ebook Komik Utama
        </a>

        <!-- Tombol 2: Google Drive -->
        <!-- Ganti tanda # di bawah dengan link Google Drive Anda -->
        <a href="#" class="link-btn" target="_blank">
            📁 Arsip Google Drive
        </a>
    </div>

</body>
</html>
